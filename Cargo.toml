[package]
name = "searchworks-mcp"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
anyhow = "1.0"
axum = "0.8"
html-escape = "0.2"
http = "1.3"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
rmcp = { version = "3.2", features = ["server", "schemars", "transport-streamable-http-server"] }
schemars = "1.0"
scraper = "0.24"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "signal"] }
tokio-util = "0.7"
tower-http = { version = "0.6", features = ["catch-panic", "request-id", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2.5"

[dev-dependencies]
wiremock = "0.6"

[profile.release]
lto = "thin"
strip = true
