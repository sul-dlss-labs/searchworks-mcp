apiVersion: v1
kind: ConfigMap
metadata:
  name: searchworks-mcp
data:
  BIND_ADDRESS: "0.0.0.0:3000"
  SEARCHWORKS_BASE_URL: "https://searchworks.stanford.edu"
  REQUEST_TIMEOUT_SECONDS: "15"
  MAX_RESPONSE_BYTES: "2000000"
  # Add the external MCP hostname used by Envoy before deployment.
  MCP_ALLOWED_HOSTS: "searchworks-mcp,localhost,127.0.0.1,::1"
  RUST_LOG: "searchworks_mcp=info,tower_http=info"
