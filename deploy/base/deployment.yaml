apiVersion: apps/v1
kind: Deployment
metadata:
  name: searchworks-mcp
  labels:
    app.kubernetes.io/name: searchworks-mcp
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: searchworks-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: searchworks-mcp
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: searchworks-mcp
          # CI publishes an immutable sha- tag on every push to main; pin one
          # here instead of :latest, which moves with every merge. IfNotPresent
          # is only safe against an immutable tag.
          image: ghcr.io/sul-dlss-labs/searchworks-mcp:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: searchworks-mcp
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
