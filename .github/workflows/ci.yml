name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A superseded run tells us nothing, and image builds are the slow part.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; only the image job widens this.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Pinned to the version the release image builds with, so a new toolchain
  # cannot fail `-D warnings` on lints the shipped binary was never checked for.
  RUST_VERSION: "1.90"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust ${{ env.RUST_VERSION }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt,clippy
          rustup default "$RUST_VERSION"

      - uses: Swatinem/rust-cache@v2

      # Mirrors `make check`, with --locked so a drifting Cargo.lock fails here.
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Test
        run: cargo test --all-features --locked

  image:
    name: Image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Pull requests build but do not push, so a broken Dockerfile is caught
      # before it reaches main. Only pushes to main need registry credentials.
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Resolves to ghcr.io/sul-dlss-labs/searchworks-mcp, the image
          # deploy/base/deployment.yaml pins. Transferring the repository moves
          # this but not the manifest; update both together.
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The Dockerfile has no dependency-only layer, so without a cache
          # every run recompiles the full dependency tree.
          cache-from: type=gha
          cache-to: type=gha,mode=max
